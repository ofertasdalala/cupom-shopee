<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Links de Desconto - Shopee</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .tabs {
            display: flex;
            background-color: #2c2c2c;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: #aaa;
        }

        .tab.active {
            background-color: #ee4d2d; /* Cor da Shopee */
            color: #fff;
            box-shadow: 0 4px 12px rgba(238, 77, 45, 0.4);
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 45px;
            background-color: #2b2b2b;
            border: 1px solid #3c3c3c;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #ee4d2d;
        }

        .input-group .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 16px;
        }

        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, #ff5722, #f44336);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
            transition: opacity 0.2s;
            margin-bottom: 24px;
        }

        .btn-generate:hover {
            opacity: 0.9;
        }

        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-social {
            flex: 1;
            padding: 14px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn-whatsapp {
            background-color: #25d366;
        }

        .btn-telegram {
            background-color: #0088cc;
        }

        .btn-social:hover {
            opacity: 0.9;
        }

        /* Caixa de Resultado */
        #result-box {
            display: none;
            margin-top: 15px;
            background: #2b2b2b;
            padding: 12px;
            border-radius: 10px;
            word-break: break-all;
            font-size: 13px;
        }
        
        #result-box a {
            color: #4da6ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Abas do Topo -->
        <div class="tabs">
            <div class="tab active">🔗 Gerar Link</div>
            <div class="tab" onclick="alert('Seção de pesquisa em breve!')">🔍 Pesquisar</div>
        </div>

        <!-- Campo de Input -->
        <div class="input-group">
            <span class="icon">📋</span>
            <input type="text" id="product-link" placeholder="Cole aqui o link do produto da Shopee...">
        </div>

        <!-- Botão Principal -->
        <button class="btn-generate" onclick="gerarLinkAfiliado()">GERAR LINK COM DESCONTO ⚡</button>

        <!-- Área de Resultado (Opcional para exibir o link gerado ou redirecionar direto) -->
        <div id="result-box">
            Link gerado com sucesso! <br>
            <a id="final-link" href="#" target="_blank">Clique aqui se não abrir automaticamente</a>
        </div>

        <!-- Botões Sociais -->
        <div class="social-buttons">
            <a href="SEU_LINK_DO_WHATSAPP" target="_blank" class="btn-social btn-whatsapp">
                💬 GRUPO SÓ CUPOM
            </a>
            <a href="SEU_LINK_DO_TELEGRAM" target="_blank" class="btn-social btn-telegram">
                🤖 BOT NO TELEGRAM
            </a>
        </div>
    </div>

    <script>
        function gerarLinkAfiliado() {
            const inputUrl = document.getElementById('product-link').value.trim();
            
            if (!inputUrl) {
                alert('Por favor, cole o link do produto da Shopee.');
                return;
            }

            // Substitua abaixo com o seu modelo de link de afiliado da Shopee ou parâmetro UTM/Deeplink
            // Exemplo genérico estruturado para programas de afiliados:
            // Se você usa o link encurtado da Shopee ou parâmetros de subID, ajuste aqui.
            
            let linkAfiliado = inputUrl;
            
            // Exemplo simples adicionando parâmetros de rastreio de afiliado caso utilize links padrão:
            // (Certifique-se de ajustar conforme a regra do seu painel de afiliado da Shopee)
            try {
                const urlObj = new URL(inputUrl);
                // Exemplo de inclusão de parâmetros de afiliado se necessário:
                // urlObj.searchParams.set('smtt', 'seu_codigo_aqui');
                // linkAfiliado = urlObj.toString();
                
                // Se preferir redirecionar direto:
                window.open(linkAfiliado, '_blank');
                
                // Ou mostrar na caixa de resultado:
                document.getElementById('final-link').href = linkAfiliado;
                document.getElementById('final-link').innerText = linkAfiliado;
                document.getElementById('result-box').style.display = 'block';

            } catch (e) {
                alert('Link inválido. Verifique o endereço inserido.');
            }
        }
    </script>

</body>
</html>
