<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Links e Busca - Shopee</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .tabs {
            display: flex;
            background-color: #2c2c2c;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: #aaa;
        }

        .tab.active {
            background-color: #ee4d2d;
            color: #fff;
            box-shadow: 0 4px 12px rgba(238, 77, 45, 0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 45px;
            background-color: #2b2b2b;
            border: 1px solid #3c3c3c;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #ee4d2d;
        }

        .input-group .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 16px;
        }

        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, #ff5722, #f44336);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
            transition: opacity 0.2s;
            margin-bottom: 24px;
        }

        .btn-generate:hover {
            opacity: 0.9;
        }

        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-social {
            flex: 1;
            padding: 14px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn-whatsapp {
            background-color: #25d366;
        }

        .btn-telegram {
            background-color: #0088cc;
        }

        .btn-social:hover {
            opacity: 0.9;
        }

        #result-box {
            display: none;
            margin-bottom: 20px;
            background: #2b2b2b;
            padding: 14px;
            border-radius: 10px;
            word-break: break-all;
            font-size: 13px;
            text-align: center;
        }
        
        #result-box a {
            color: #4da6ff;
            text-decoration: underline;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Abas do Topo -->
        <div class="tabs">
            <div class="tab active" id="tab-link" onclick="switchTab('link')">🔗 Gerar Link</div>
            <div class="tab" id="tab-search" onclick="switchTab('search')">🔍 Pesquisar</div>
        </div>

        <!-- Conteúdo da Aba 1: Gerar Link -->
        <div id="content-link" class="tab-content active">
            <div class="input-group">
                <span class="icon">📋</span>
                <input type="text" id="product-link" placeholder="Cole aqui o link do produto da Shopee...">
            </div>
            <button class="btn-generate" onclick="gerarLinkAfiliado()">GERAR LINK COM DESCONTO ⚡</button>
        </div>

        <!-- Conteúdo da Aba 2: Pesquisar -->
        <div id="content-search" class="tab-content">
            <div class="input-group">
                <span class="icon">🔍</span>
                <input type="text" id="search-keyword" placeholder="O que você procura na Shopee?">
            </div>
            <button class="btn-generate" onclick="pesquisarShopee()">BUSCAR NA SHOPEE 🛍️</button>
        </div>

        <!-- Caixa de Resultado -->
        <div id="result-box">
            <span>Link de Afiliado Gerado:</span><br><br>
            <a id="final-link" href="#" target="_blank">Clique para abrir o produto</a>
        </div>

        <!-- Botões Sociais -->
        <div class="social-buttons">
            <a href="https://chat.whatsapp.com/KtUorhgfb9J1EwtOnIA530" target="_blank" class="btn-social btn-whatsapp">
                💬 GRUPO NO WHATSAPP
            </a>
            <a href="https://t.me/promos_da_lala" target="_blank" class="btn-social btn-telegram">
                🤖 GRUPO NO TELEGRAM
            </a>
        </div>
    </div>

    <script>
        // ID de Afiliado injetado ou configurado
        const MY_AFFILIATE_ID = "__AFFILIATE_ID__"; 

        function switchTab(type) {
            document.getElementById('tab-link').classList.remove('active');
            document.getElementById('tab-search').classList.remove('active');
            document.getElementById('content-link').classList.remove('active');
            document.getElementById('content-search').classList.remove('active');

            if (type === 'link') {
                document.getElementById('tab-link').classList.add('active');
                document.getElementById('content-link').classList.add('active');
            } else {
                document.getElementById('tab-search').classList.add('active');
                document.getElementById('content-search').classList.add('active');
            }
        }

        function pesquisarShopee() {
            const query = document.getElementById('search-keyword').value.trim();
            if (!query) {
                alert('Digite um termo para pesquisar.');
                return;
            }
            const searchUrl = `https://shopee.com.br/search?keyword=${encodeURIComponent(query)}`;
            window.open(searchUrl, '_blank');
        }

        function gerarLinkAfiliado() {
            const inputUrl = document.getElementById('product-link').value.trim();
            
            if (!inputUrl) {
                alert('Por favor, cole o link do produto da Shopee.');
                return;
            }

            const encodedUrl = encodeURIComponent(inputUrl);
            const trackingLink = `https://s.shopee.com.br/an_redir?origin_link=${encodedUrl}&affiliate_id=${MY_AFFILIATE_ID}`;

            const resultBox = document.getElementById('result-box');
            const finalLinkAnchor = document.getElementById('final-link');

            finalLinkAnchor.href = trackingLink;
            finalLinkAnchor.innerText = trackingLink;
            resultBox.style.display = 'block';

            window.open(trackingLink, '_blank');
        }
    </script>

</body>
</html>
